<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cake Studio</title>
    <!-- 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="./register.css">

</head>

<body>
    <!-- ========HEADER=========== -->
    <header class="header">
        <div class="header-inner">
            <a href="./index.html" class="logo">
                <img src="./indeximg/logo.png" alt="My Cake Studio">
            </a>
        </div>

        <nav class="nav" id="mainNav">
            <a href="./index.html">首頁</a>
            <a href="./customizeCake.html">客製化蛋糕</a>
            <a href="./about.html">關於My Cake</a>
            <a href="./news.html">最新動態</a>
        </nav>

        <div class="header-icon">
            <button class="mobile-menu-toggle" id="mobileMenuBtn">
                <i class="fa-solid fa-bars"></i>
            </button>
            <!-- 會員選單 Wrapper -->
            <div class="member-menu-wrapper" style="position: relative;">
                <!-- 點擊觸發彈出選單的按鈕 -->
                <a href="javascript:void(0)" id="openMemberBtn">
                    <i class="fa-regular fa-user"></i>
                </a>

                <!-- 點擊圖示後彈出的下拉選單 -->
                <div class="member-dropdown" id="memberDropdown">
                    <!-- 未登入狀態：顯示登入與註冊按鈕 -->
                    <div id="loggedOutView" class="member-view">
                        <div class="member-btn-group">
                            <a href="./login.html" class="member-btn login-btn">會員登入</a>
                            <a href="./register.html" class="member-btn register-btn">新會員註冊</a>
                        </div>
                    </div>

                    <!-- 已登入狀態：顯示個人帳戶選單（已移除登出） -->
                    <div id="loggedInView" class="member-view" style="display: none;">
                        <div class="user-greeting">嗨，<span id="userNameDisplay">會員</span></div>
                        <hr class="menu-divider">
                        <ul class="member-links">
                            <li><a href="./member.html">我的帳戶</a></li>
                            <li><a href="#">訂單查詢</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- 購物車圖示 -->
            <a href="javascript:void(0)" class="cart-icon-wrapper" id="openCartBtn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cartBadge"></span>
            </a>
        </div>
    </header>
    <!-- ========REGISTER=========== -->
    <main class="register">
        <h1>新會員註冊</h1>
        <form class="register-form">
            <div class="form-group">
                <label for="email">電子郵件</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="name">姓名</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="phone">電話</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="password-confirm">密碼確認</label>
                <input type="password" id="password-confirm" name="password-confirm" required>
            </div>
            <div class="login-link">
                <span>我已經有會員帳號了</span>
                <a href="./login.html">登入會員</a>
            </div>
            <button type="submit" class="register-btn">加入會員</button>
        </form>
    </main>
    <!-- ======== 購物車側邊抽屜 (Drawer) =========== -->
    <div class="cart-drawer-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-drawer-header">
            <h3>購物車清單</h3>
            <button class="close-cart" id="closeCartBtn">&times;</button>
        </div>
        <div class="cart-items-list" id="cartItemsList">
            <!-- 購物車項目會由 JavaScript 動態寫入 -->
        </div>
        <div class="cart-drawer-footer">
            <div class="cart-total-row">
                <span>總計金額</span>
                <span id="drawerTotalAmount">NT$ 0</span>
            </div>
            <button class="checkout-btn" onclick="handleCheckout()">前往結帳</button>
        </div>
    </div>
    <!-- ========FOOTER=========== -->
    <footer>
        <p>&copy;2026 All Rights Reserved by My Cake Studio
        </p>
        <div>
            <a href="#">隱私權政策</a>
            <a href="#">Back to Top</a>
        </div>
    </footer>

   <script>
    document.addEventListener("DOMContentLoaded", function () {
         // ==================== 手機版漢堡選單邏輯 ================
            const mobileMenuBtn = document.getElementById("mobileMenuBtn");
            const mainNav = document.getElementById("mainNav");
            if (mobileMenuBtn && mainNav) {
                mobileMenuBtn.addEventListener("click", function () {
                    // 點擊時切換 active 狀態 
                    mainNav.classList.toggle("active");
                    // 檢查目前選單狀態 
                    console.log("目前選單是否開啟：",
                        mainNav.classList.contains("active"));
                });
            }
        // 1. 從 localStorage 讀取購物車資料
        let cart = JSON.parse(localStorage.getItem("cake_cart")) || [];

        // 2. 取得 DOM 元素
        const registerForm = document.querySelector(".register-form");
        const cartBadge = document.getElementById("cartBadge");
        const cartItemsList = document.getElementById("cartItemsList");
        const drawerTotalAmount = document.getElementById("drawerTotalAmount");
        const cartDrawer = document.getElementById("cartDrawer");
        const cartOverlay = document.getElementById("cartOverlay");
        const openCartBtn = document.getElementById("openCartBtn");
        const closeCartBtn = document.getElementById("closeCartBtn");

        // 3. 表單提交處理（註冊 + 自動登入與動態跳轉）
        if (registerForm) {
            registerForm.addEventListener("submit", function (e) {
                e.preventDefault(); // 阻擋預設表單送出行為

                // 取得表單欄位值
                const email = document.getElementById("email").value.trim().toLowerCase();
                const name = document.getElementById("name").value.trim();
                const phone = document.getElementById("phone").value.trim();
                const password = document.getElementById("password").value;
                const passwordConfirm = document.getElementById("password-confirm").value;

                // 密碼一致性驗證
                if (password !== passwordConfirm) {
                    alert("兩次輸入的密碼不一致！");
                    return;
                }

                // 讀取所有已註冊會員
                const users = JSON.parse(localStorage.getItem("users") || "[]");

                // 檢查 Email 是否重複
                const existingUser = users.find(function (user) {
                    return user.email === email;
                });
                
                if (existingUser) {
                    alert("這個 Email 已經註冊過了！");
                    return;
                }

                // 建立新會員資料物件
                const newUser = {
                    email: email,
                    name: name,
                    phone: phone,
                    password: password
                };

                // 把新會員加入會員資料庫（陣列）
                users.push(newUser);
                localStorage.setItem("users", JSON.stringify(users));

                // 🌟 Key 修改 1：註冊成功後自動保持登入狀態
                const currentUser = {
                    email: newUser.email,
                    name: newUser.name,
                    phone: newUser.phone,
                    isLoggedIn: true
                };
                localStorage.setItem("user_info", JSON.stringify(currentUser));

                alert("註冊成功！已自動為您登入。");

                // 🌟 Key 修改 2：檢查網址參數，決定要跳轉到結帳頁還是首頁
                const urlParams = new URLSearchParams(window.location.search);
                const redirectTarget = urlParams.get("redirect");

                if (redirectTarget === "checkout") {
                    window.location.href = "./checkout.html";
                } else {
                    window.location.href = "./index.html";
                }
            });
        }

        // 4. 控制側邊抽屜開啟/關閉
        function toggleCart(open) {
            if (cartDrawer && cartOverlay) {
                if (open) {
                    cartDrawer.classList.add("active");
                    cartOverlay.classList.add("active");
                } else {
                    cartDrawer.classList.remove("active");
                    cartOverlay.classList.remove("active");
                }
            }
        }

        // 5. 更新購物車 UI (渲染清單與計算總金額)
        function updateCartUI() {
            localStorage.setItem("cake_cart", JSON.stringify(cart));

            if (cartBadge) {
                const totalCount = cart.length;
                cartBadge.textContent = totalCount;
                cartBadge.style.display = totalCount > 0 ? "flex" : "none";
            }

            if (!cartItemsList) return;
            cartItemsList.innerHTML = "";

            if (cart.length === 0) {
                cartItemsList.innerHTML = `<div class="empty-msg">購物車目前是空的</div>`;
                if (drawerTotalAmount) drawerTotalAmount.textContent = "NT\$ 0";
                return;
            }

            let grandTotal = 0;
            let listHtml = "";

            cart.forEach((item, index) => {
                grandTotal += Number(item.price) || 0;

                listHtml += `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-title">客製化蛋糕 (${item.size ? item.size + '吋' : '未指定'})</div>
                        <div class="cart-item-detail">
                            口味: ${item.flavor || '預設'} / 風格: ${item.style || '無'} / 顏色: ${item.color || '預設'}<br>
                            ${item.text ? `標語: "${item.text}"` : '無標語'}
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div class="cart-item-price">NT$ ${item.price}</div>
                        <span class="remove-item" onclick="removeCartItem(${index})" style="cursor:pointer;">
                            <i class="fa-solid fa-trash-can"></i>
                        </span>
                    </div>
                </div>
                `;
            });

            cartItemsList.innerHTML = listHtml;

            if (drawerTotalAmount) {
                drawerTotalAmount.textContent = `NT$ ${grandTotal}`;
            }
        }

        // 6. 提供刪除項目的全域函式
        window.removeCartItem = function (index) {
            cart.splice(index, 1);
            updateCartUI();
        };

        // 7. 跨頁面同步購物車
        window.addEventListener("storage", function (e) {
            if (e.key === "cake_cart") {
                cart = JSON.parse(e.newValue) || [];
                updateCartUI();
            }
        });

        // 8. 事件監聽
        if (openCartBtn) {
            openCartBtn.addEventListener("click", function (e) {
                e.preventDefault();
                toggleCart(true);
            });
        }

        if (closeCartBtn) closeCartBtn.addEventListener("click", () => toggleCart(false));
        if (cartOverlay) cartOverlay.addEventListener("click", () => toggleCart(false));

        // 初始渲染購物車
        updateCartUI();

        // ==== 會員下拉選單邏輯 ===========
        const openMemberBtn = document.getElementById("openMemberBtn");
        const memberDropdown = document.getElementById("memberDropdown");
        const loggedOutView = document.getElementById("loggedOutView");
        const loggedInView = document.getElementById("loggedInView");
        const userNameDisplay = document.getElementById("userNameDisplay");

        // 檢查登入狀態並更新顯示切換
        function checkUserLoginStatus() {
            const userInfo = JSON.parse(localStorage.getItem("user_info"));
            if (userInfo && userInfo.isLoggedIn) {
                if (loggedOutView) loggedOutView.style.display = "none";
                if (loggedInView) loggedInView.style.display = "block";
                if (userNameDisplay) userNameDisplay.textContent = userInfo.name || "會員";
            } else {
                if (loggedOutView) loggedOutView.style.display = "block";
                if (loggedInView) loggedInView.style.display = "none";
            }
        }

        // 點擊會員 icon 開關彈出選單
        if (openMemberBtn) {
            openMemberBtn.addEventListener("click", function (e) {
                e.stopPropagation();
                checkUserLoginStatus();
                if (memberDropdown) memberDropdown.classList.toggle("active");
            });
        }

        // 點擊頁面其他空白處時自動關閉選單
        document.addEventListener("click", function (e) {
            if (memberDropdown && !memberDropdown.contains(e.target) && openMemberBtn && !openMemberBtn.contains(e.target)) {
                memberDropdown.classList.remove("active");
            }
        });
    });

    // 購物車按鈕：前往結帳邏輯 (需放在 DOMContentLoaded 外面)
    function handleCheckout() {
        const userInfo = JSON.parse(localStorage.getItem("user_info"));
        if (userInfo && userInfo.isLoggedIn) {
            window.location.href = './checkout.html';
        } else {
            window.location.href = './login.html?redirect=checkout';
        }
    }
</script>
</body>

</html>
