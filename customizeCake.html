    <!-- JS 邏輯整合 -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // ==================== 手機版漢堡選單邏輯 ================
            const mobileMenuBtn = document.getElementById("mobileMenuBtn");
            const mainNav = document.getElementById("mainNav");
            if (mobileMenuBtn && mainNav) {
                mobileMenuBtn.addEventListener("click", function () {
                    // 點擊時切換 active 狀態 
                    mainNav.classList.toggle("active");
                    // 檢查目前選單狀態 
                    console.log("目前選單是否開啟：",
                        mainNav.classList.contains("active"));
                });
            }
            // 風格圖片對應檔名
            const styleImages = {
                "簡約": "./styleimg/style-01.png",
                "可愛": "./styleimg/style-02.png",
                "花朵": "./styleimg/style-03.png",
                "生日": "./styleimg/style-04.png"
            };

            // DOM 元素取得
            const cakeBase = document.querySelector("#cakeBase");
            const cakeTopEllipse = document.querySelector("#cakeBaseGroup ellipse");
            const cakeLayer = document.querySelector("#creamLayer");
            const cakeSVGText = document.querySelector("#cakeSVGText");
            const stylePattern = document.querySelector("#stylePattern");
            const totalPriceText = document.querySelector(".total-price span");
            const cakeMessageArea = document.querySelector('textarea[name="cake-message"]');
            // 選項 Radio 按鈕
            const flavorRadios = document.querySelectorAll('input[name="cake-flavor"]');
            const colorRadios = document.querySelectorAll('input[name="cake-color"]');
            const cakeTextRadios = document.querySelectorAll('input[name="cake-text"]');
            const sizeRadios = document.querySelectorAll('input[name="cake-size"]');
            const styleRadios = document.querySelectorAll('input[name="cake-style"]');
            // 購物車相關功能DOM
            const addToCartBtn = document.querySelector(".add-cart");
            const openCartBtn = document.querySelector("#openCartBtn");
            const closeCartBtn = document.querySelector("#closeCartBtn");
            const cartBadge = document.querySelector("#cartBadge");
            const cartDrawer = document.querySelector("#cartDrawer");
            const cartOverlay = document.querySelector("#cartOverlay");
            const cartItemsList = document.querySelector("#cartItemsList");
            const drawerTotalAmount = document.querySelector("#drawerTotalAmount");

            // 購物車資料儲存陣列與當前價格變數
            let cart = JSON.parse(localStorage.getItem("cake_cart")) || [];
            let currentTotalPrice = 500;

            // 1. 計算並更新總價
            function updatePrice() {
                let total = 0;
                const selectedSize = document.querySelector('input[name="cake-size"]:checked');
                const selectedFlavor = document.querySelector('input[name="cake-flavor"]:checked');
                const selectedStyle = document.querySelector('input[name="cake-style"]:checked');

                if (selectedSize) total += Number(selectedSize.dataset.price || 0);
                if (selectedFlavor) total += Number(selectedFlavor.dataset.price || 0);
                if (selectedStyle) total += Number(selectedStyle.dataset.price || 0);
                currentTotalPrice = total;
                totalPriceText.textContent = `NT$ ${total}`;
            }

            // 2. 更新 SVG 文字
            function updateCakeText() {
                const selectedTextMode = document.querySelector('input[name="cake-text"]:checked')?.value;
                cakeSVGText.textContent = (selectedTextMode === "指定文字") ? cakeMessageArea.value : "";
            }

            // 3. 更新 SVG 風格圖案
            function updateCakeStyle() {
                const selectedStyle = document.querySelector('input[name="cake-style"]:checked')?.value;
                if (!stylePattern) return;

                const imagePath = styleImages[selectedStyle];
                if (imagePath) {
                    stylePattern.setAttribute('href', imagePath);
                    stylePattern.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', imagePath);
                    stylePattern.setAttribute("visibility", "visible");
                } else {
                    stylePattern.setAttribute("visibility", "hidden");
                }
            }
            // ==========================================
            // 2. 購物車核心邏輯 (Badge 更新 / 抽屜渲染 / 刪除)
            // ==========================================
            // 開啟或關閉購物車抽屜
            function toggleCart(open) {
                if (open) {
                    cartDrawer.classList.add("active");
                    cartOverlay.classList.add("active");
                } else {
                    cartDrawer.classList.remove("active");
                    cartOverlay.classList.remove("active");
                }
            }
            // 更新購物車數字標籤 (Badge) 與側邊欄內容
            function updateCartUI() {
                // 1. 同步儲存至 localStorage
                localStorage.setItem("cake_cart", JSON.stringify(cart));
                // 更新 Badge 數量與顯示
                const totalCount = cart.length;
                if (totalCount > 0) {
                    cartBadge.textContent = totalCount;
                    cartBadge.style.display = "flex";
                } else {
                    cartBadge.style.display = "none";
                }
                // 如果購物車是空的
                if (cart.length === 0) {
                    cartItemsList.innerHTML = '<div class="empty-msg">購物車目前是空的</div>';
                    drawerTotalAmount.textContent = "NT$ 0";
                    return;
                }
                // 渲染購物車清單
                let listHtml = "";
                let grandTotal = 0;

                cart.forEach((item, index) => {
                    grandTotal += item.price;
                    listHtml += `<div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-title">客製化蛋糕 (${item.size}吋)</div>
                        <div class="cart-item-detail">
                            口味: ${item.flavor} / 風格: ${item.style} / 顏色: ${item.color}<br>${item.text ? `標語: "${item.text}"` : '無標語'}
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div class="cart-item-price">NT$ ${item.price}</div>
                        <span class="remove-item" onclick="removeCartItem(${index})">
                            <i class="fa-solid fa-trash-can"></i>
                        </span>
                    </div>
                </div>`;
                });
                cartItemsList.innerHTML = listHtml;
                drawerTotalAmount.textContent = `NT$ ${grandTotal}`;
            }
            /* 點擊「加入購物車」 */
            if (addToCartBtn) {
                addToCartBtn.addEventListener("click", async function () {

                    // ① 收集目前選擇的客製化資料
                    const size = document.querySelector('input[name="cake-size"]:checked')?.value;

                    const flavor = document.querySelector('input[name="cake-flavor"]:checked')?.value;

                    const style = document.querySelector('input[name="cake-style"]:checked')?.value;

                    const colorInput = document.querySelector('input[name="cake-color"]:checked');

                    const color = colorInput?.value;
                    const creamColor = colorInput?.dataset.color;

                    const flavorInput = document.querySelector('input[name="cake-flavor"]:checked');

                    const baseColor = flavorInput?.dataset.color;

                    const textMode = document.querySelector('input[name="cake-text"]:checked')?.value;

                    const message = textMode === "指定文字" ? cakeMessageArea.value.trim() : "";

                    // ② 複製目前的 SVG 蛋糕預覽
                    const cakeSVG = document.querySelector(".cake svg");
                    const svgCopy = cakeSVG.cloneNode(true);

                    // 明確設定 SVG 命名空間
                    svgCopy.setAttribute(
                        "xmlns",
                        "http://www.w3.org/2000/svg"
                    );

                    // ③ 把外部風格圖片轉成 Base64，
                    //    避免結帳頁面無法讀取圖片路徑
                    try {
                        const images = svgCopy.querySelectorAll("image");

                        for (const img of images) {
                            const imagePath =
                                img.getAttribute("href") ||
                                img.getAttributeNS(
                                    "http://www.w3.org/1999/xlink",
                                    "href"
                                );

                            if (!imagePath) continue;

                            // 已經是內嵌圖片就不必重複處理
                            if (imagePath.startsWith("data:")) continue;

                            const response = await fetch(
                                new URL(imagePath, document.baseURI).href
                            );

                            if (!response.ok) {
                                throw new Error(
                                    `無法載入風格圖片：${imagePath}`
                                );
                            }

                            const blob = await response.blob();

                            const dataURL = await new Promise(
                                (resolve, reject) => {
                                    const reader = new FileReader();

                                    reader.onload = () =>
                                        resolve(reader.result);

                                    reader.onerror = reject;
                                    reader.readAsDataURL(blob);
                                }
                            );

                            img.setAttribute("href", dataURL);

                            img.setAttributeNS(
                                "http://www.w3.org/1999/xlink",
                                "xlink:href",
                                dataURL
                            );
                        }

                        // ④ 將 SVG 轉成可儲存的圖片資料
                        const svgText =
                            new XMLSerializer().serializeToString(svgCopy);

                        const cakeImage =
                            "data:image/svg+xml;charset=utf-8," +
                            encodeURIComponent(svgText);

                        // ⑤ 儲存商品資料
                        const newItem = {
                            id: Date.now(),
                            size: size,
                            flavor: flavor,
                            style: style,
                            color: color,

                            // 額外保存實際顏色代碼
                            baseColor: baseColor,
                            creamColor: creamColor,

                            text: message,
                            price: currentTotalPrice,

                            // 完整蛋糕預覽圖片
                            image: cakeImage
                        };

                        // ⑥ 加入購物車並更新畫面
                        cart.push(newItem);
                        updateCartUI();

                        cartBadge.classList.add("bump");

                        setTimeout(() => {
                            cartBadge.classList.remove("bump");
                        }, 200);

                        toggleCart(true);

                    } catch (error) {
                        console.error("儲存蛋糕預覽失敗：", error);

                        alert(
                            "蛋糕圖片儲存失敗，請確認 styleimg 資料夾中的圖片路徑，並重新嘗試。"
                        );
                    }
                });
            }
            // 刪除購物車項目的全域函式 (供 onclick 呼叫)
            window.removeCartItem = function (index) {
                cart.splice(index, 1);
                updateCartUI();
            };

            // ==========================================
            // 3. 事件監聽綁定
            // ==========================================
            // 開啟/關閉購物車抽屜事件
            if (openCartBtn) {
                openCartBtn.addEventListener("click", function (e) {
                    e.preventDefault();
                    toggleCart(true);
                });
            }
            if (closeCartBtn) closeCartBtn.addEventListener("click", () => toggleCart(false));
            if (cartOverlay) cartOverlay.addEventListener("click", () => toggleCart(false));
            // 客製化選項監聽綁定
            flavorRadios.forEach(radio => {
                radio.addEventListener("change", function () {
                    const color = this.dataset.color;
                    if (color) {
                        if (cakeBase) cakeBase.setAttribute("fill", color);
                        if (cakeTopEllipse) cakeTopEllipse.setAttribute("fill", color);
                    }
                    updatePrice();
                });
            });

            colorRadios.forEach(radio => {
                radio.addEventListener("change", function () {
                    const color = this.dataset.color;
                    if (color && cakeLayer) {
                        cakeLayer.setAttribute("fill", color);
                    }
                });
            });

            if (cakeMessageArea) {
                cakeMessageArea.addEventListener("input", updateCakeText);
            }

            cakeTextRadios.forEach(radio => {
                radio.addEventListener("change", function () {
                    const isNoText = (this.value === "不要文字");
                    cakeMessageArea.value = isNoText ? "" : cakeMessageArea.value;
                    cakeMessageArea.disabled = isNoText;
                    updateCakeText();
                });
            });

            sizeRadios.forEach(radio => radio.addEventListener("change", updatePrice));

            styleRadios.forEach(radio => {
                radio.addEventListener("change", function () {
                    updatePrice();
                    updateCakeStyle();
                });
            });

            // 初始執行一次
            updatePrice();
            updateCakeText();
            updateCakeStyle();
            updateCartUI();
            // ====2. 會員下拉選單邏輯 (放這裡最適合) ===========
            const openMemberBtn = document.getElementById("openMemberBtn");
            const memberDropdown = document.getElementById("memberDropdown");
            const loggedOutView = document.getElementById("loggedOutView");
            const loggedInView = document.getElementById("loggedInView");
            const userNameDisplay = document.getElementById("userNameDisplay");

            // 檢查登入狀態並更新顯示切換
            function checkUserLoginStatus() {
                const userInfo = JSON.parse(localStorage.getItem("user_info"));
                // userInfo && userInfo.isLoggedIn
                if (userInfo && userInfo.isLoggedIn) {
                    loggedOutView.style.display = "none";
                    loggedInView.style.display = "block";
                    if (userNameDisplay) userNameDisplay.textContent = userInfo.name || "會員";
                } else {
                    loggedOutView.style.display = "block";
                    loggedInView.style.display = "none";
                }
            }
            // 點擊會員 icon 開關彈出選單
            if (openMemberBtn) {
                openMemberBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    checkUserLoginStatus();
                    if (memberDropdown) memberDropdown.classList.toggle("active");
                });
            }
            // 點擊頁面其他空白處時自動關閉選單
            document.addEventListener("click", function (e) {
                if (memberDropdown && !memberDropdown.contains(e.target) && openMemberBtn && !openMemberBtn.contains(e.target)) {
                    memberDropdown.classList.remove("active");
                }
            });
        });// DOMContentLoaded 結束點
        // DOMContentLoaded 結束點

    // ==== 9. 購物車按鈕：前往結帳邏輯 (需放在 DOMContentLoaded 外面) ===========
    function handleCheckout() {
        const userInfo = JSON.parse(localStorage.getItem("user_info"));

        // 判斷是否有登入紀錄
        if (userInfo && userInfo.isLoggedIn) {
            // 已登入：前往結帳頁
            window.location.href = './checkout.html';
        } else {
            // 未登入：前往登入頁，並附帶 redirect=checkout 參數
            window.location.href = './login.html?redirect=checkout';
        }
    }
    </script>
</body>
