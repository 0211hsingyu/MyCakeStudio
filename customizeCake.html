<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cake Studio</title>
    <!-- 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./customizeCake.css">
</head>

<body>
    <!-- ======== HEADER =========== -->
    <header class="header">
        <div class="header-inner">
            <a href="./index.html" class="logo">
                <img src="./logo.png" alt="My Cake Studio">
            </a>
        </div>

        <nav class="nav">
            <a href="./index.html">首頁</a>
            <a href="./customizeCake.html">客製化蛋糕</a>
            <a href="./about.html">關於My Cake</a>
            <a href="./news.html">最新動態</a>
        </nav>

        <div class="header-icon">
            <a href="./member.html"><i class="fa-regular fa-user"></i></a>
            <a href="./cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
        </div>
    </header>

    <!-- ======== MAIN CONTENT =========== -->
    <main class="customize-cake">
        <!-- 左側蛋糕預覽 -->
        <section class="cake-preview">
            <h2>預覽圖片</h2>
            <div class="preview">
                <div class="cake">
                    <svg viewBox="0 0 400 400" style="width: 100%; height: auto;">
                        <!-- ① 蛋糕底層與整體結構 -->
                        <g id="cakeBaseGroup">
                            <path id="cakeBase" d="M 60,140 A 140,40 0 0,0 340,140 L 340,295 A 140,40 0 0,1 60,295 Z"
                                fill="#e6b98a" stroke="rgb(145, 145, 145)" stroke-width="5" stroke-linejoin="round" />
                            <path d="M 60,195 A 140,40 0 0,0 340,195" fill="none" stroke="rgb(145, 145, 145)" stroke-width="4" />
                            <path d="M 60,210 A 140,40 0 0,0 340,210" fill="none" stroke="rgb(145, 145, 145)" stroke-width="3" stroke-dasharray="6,4" />
                            <path d="M 60,245 A 140,40 0 0,0 340,245" fill="none" stroke="rgb(145, 145, 145)" stroke-width="4" />
                            <path d="M 60,260 A 140,40 0 0,0 340,260" fill="none" stroke="rgb(145, 145, 145)" stroke-width="3" stroke-dasharray="6,4" />
                            <ellipse cx="200" cy="140" rx="140" ry="40" fill="#e6b98a" stroke="rgb(145, 145, 145)" stroke-width="5" />
                        </g>

                        <!-- ② 奶油圖層 -->
                        <g id="creamLayer" fill="#fff3df" stroke="rgb(145, 145, 145)" stroke-width="4" stroke-linejoin="round">
                            <path id="creamTop"
                                d="M 60,140 C 60,180 80,185 90,175 C 100,165 110,205 125,200 C 140,195 150,175 160,180 C 170,185 180,210 195,205 C 210,200 220,180 230,185 C 240,190 250,215 265,210 C 280,205 290,175 305,185 C 320,195 340,170 340,140 A 140,40 0 0,0 60,140 Z" />
                            <ellipse cx="200" cy="140" rx="138" ry="38" fill="none" stroke="rgb(145, 145, 145)" stroke-width="4" />
                            <path
                                d="M 55,295 Q 65,280 80,295 Q 95,280 110,298 Q 125,283 140,303 Q 155,288 170,308 Q 185,293 200,309 Q 215,293 230,308 Q 245,288 260,303 Q 275,283 290,298 Q 305,280 320,295 Q 335,280 345,295 A 140,40 0 0,1 55,295 Z" />
                        </g>

                        <!-- 風格圖案 (預覽) -->
                        <image id="stylePattern" x="60" y="140" width="280" height="200" preserveAspectRatio="none" visibility="hidden" pointer-events="none" />

                        <!-- ③ 蛋糕文字 -->
                        <text id="cakeSVGText" x="200" y="140" text-anchor="middle" dominant-baseline="middle"
                            fill="#5a3d28" font-size="16" font-weight="bold" font-family="'Noto Sans TC', sans-serif">
                        </text>
                    </svg>
                </div>
            </div>
        </section>

        <!-- 右側客製化選項 -->
        <section class="customize-options">
            <h2>客製化選項</h2>

            <!-- ① 蛋糕尺寸 -->
            <div class="option-group">
                <div class="option-title">
                    <span>①</span>
                    <label>蛋糕尺寸:</label>
                </div>
                <div class="option-item">
                    <label class="radio-option">
                        <input type="radio" name="cake-size" value="4" data-price="500" checked>
                        <span class="radio-circle"></span>
                        <div class="size-box">
                            <div class="size-text">
                                <span class="size-title">4吋</span>
                                <small>約2-4人</small>
                            </div>
                            <span class="price">+$500</span>
                        </div>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-size" value="6" data-price="700">
                        <span class="radio-circle"></span>
                        <div class="size-box">
                            <div class="size-text">
                                <span class="size-title">6吋</span>
                                <small>約4-6人</small>
                            </div>
                            <span class="price">+$700</span>
                        </div>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-size" value="8" data-price="900">
                        <span class="radio-circle"></span>
                        <div class="size-box">
                            <div class="size-text">
                                <span class="size-title">8吋</span>
                                <small>約6-10人</small>
                            </div>
                            <span class="price">+$900</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- ② 蛋糕口味 -->
            <div class="option-group">
                <div class="option-title">
                    <span>②</span>
                    <label>蛋糕口味:</label>
                </div>
                <div class="option-item">
                    <label class="radio-option">
                        <input type="radio" name="cake-flavor" value="原味" data-color="#e6b98a" data-price="0" checked>
                        <span class="radio-circle"></span>
                        <span>原味</span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-flavor" value="巧克力" data-color="#6d4c41" data-price="50">
                        <span class="radio-circle"></span>
                        <span>巧克力 +$50</span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-flavor" value="抹茶" data-color="#BEDCAF" data-price="60">
                        <span class="radio-circle"></span>
                        <span>抹茶 +$60</span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-flavor" value="草莓" data-color="#F0D2E6" data-price="80">
                        <span class="radio-circle"></span>
                        <span>草莓 +$80</span>
                    </label>
                </div>
            </div>

            <!-- ③ 蛋糕風格 -->
            <div class="option-group">
                <div class="option-title">
                    <span>③</span>
                    <label>蛋糕風格:</label>
                </div>
                <div class="option-item style-options">
                    <label class="radio-option">
                        <input type="radio" name="cake-style" value="簡約" data-price="0" checked>
                        <div class="style-title-box">
                            <span class="radio-circle"></span>
                            <span>簡約</span>
                        </div>
                        <span class="style-icon"><img src="./styleimg/icon4-01.png" alt="簡約風格"></span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-style" value="可愛" data-price="50">
                        <div class="style-title-box">
                            <span class="radio-circle"></span>
                            <span>可愛 +$50</span>
                        </div>
                        <span class="style-icon"><img src="./styleimg/icon2-01.png" alt="可愛風格"></span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-style" value="花朵" data-price="60">
                        <div class="style-title-box">
                            <span class="radio-circle"></span>
                            <span>花朵 +$60</span>
                        </div>
                        <span class="style-icon"><img src="./styleimg/icon3-01.png" alt="花朵風格"></span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-style" value="生日" data-price="70">
                        <div class="style-title-box">
                            <span class="radio-circle"></span>
                            <span>生日 +$70</span>
                        </div>
                        <span class="style-icon"><img src="./styleimg/icon1-01.png" alt="生日風格"></span>
                    </label>
                </div>
            </div>

            <!-- ④ 蛋糕顏色 -->
            <div class="option-group">
                <div class="option-title">
                    <span>④</span>
                    <label>蛋糕顏色:</label>
                </div>
                <div class="option-item color-options">
                    <label class="radio-option">
                        <input type="radio" name="cake-color" value="白色" data-color="#fff3df" checked>
                        <span class="radio-circle"></span>
                        <span>白色</span>
                        <span class="color-dot white"></span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-color" value="粉色" data-color="#f2b8c2">
                        <span class="radio-circle"></span>
                        <span>粉色</span>
                        <span class="color-dot pink"></span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-color" value="藍色" data-color="#B9DCFA">
                        <span class="radio-circle"></span>
                        <span>藍色</span>
                        <span class="color-dot blue"></span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-color" value="紫色" data-color="#B4BEFF">
                        <span class="radio-circle"></span>
                        <span>紫色</span>
                        <span class="color-dot purple"></span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="cake-color" value="黃色" data-color="#FFFAAF">
                        <span class="radio-circle"></span>
                        <span>黃色</span>
                        <span class="color-dot yellow"></span>
                    </label>
                </div>
            </div>

            <!-- ⑤ 蛋糕文字 -->
            <div class="option-group text-option">
                <div class="option-title">
                    <span>⑤</span>
                    <label>蛋糕文字:</label>
                </div>
                <div class="text-choice">
                    <label class="radio-option">
                        <input type="radio" name="cake-text" value="指定文字" checked>
                        <span class="radio-circle"></span>
                        <span>指定文字</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="cake-text" value="不要文字">
                        <span class="radio-circle"></span>
                        <span>不要文字</span>
                    </label>
                </div>
                <div class="text-input">
                    <textarea name="cake-message" maxlength="25" placeholder="(25字以內)"></textarea>
                </div>
            </div>

            <!-- 價格 / 加入購物車 -->
            <div class="cart-area">
                <div class="total-price">
                    總計 <span>NT$ 500</span>
                </div>
                <button type="button" class="add-cart">加入購物車</button>
            </div>
        </section>
    </main>

    <!-- ======== FOOTER =========== -->
    <footer>
        <p>&copy;2026 All Rights Reserved by My Cake Studio</p>
        <div>
            <a href="#">隱私權政策</a>
            <a href="#">Back to Top</a>
        </div>
    </footer>

    <!-- JS 邏輯整合 -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 風格圖片對應檔名
            const styleImages = {
                "簡約": "./styleimg/style-01.png",
                "可愛": "./styleimg/style-02.png",
                "花朵": "./styleimg/style-03.png",
                "生日": "./styleimg/style-04.png"
            };

            // DOM 元素取得
            const cakeBase = document.querySelector("#cakeBase");
            const cakeTopEllipse = document.querySelector("#cakeBaseGroup ellipse");
            const cakeLayer = document.querySelector("#creamLayer");
            const cakeSVGText = document.querySelector("#cakeSVGText");
            const stylePattern = document.querySelector("#stylePattern");
            const totalPriceText = document.querySelector(".total-price span");
            const cakeMessageArea = document.querySelector('textarea[name="cake-message"]');

            const flavorRadios = document.querySelectorAll('input[name="cake-flavor"]');
            const colorRadios = document.querySelectorAll('input[name="cake-color"]');
            const cakeTextRadios = document.querySelectorAll('input[name="cake-text"]');
            const sizeRadios = document.querySelectorAll('input[name="cake-size"]');
            const styleRadios = document.querySelectorAll('input[name="cake-style"]');

            // 1. 計算並更新總價
            function updatePrice() {
                let total = 0;
                const selectedSize = document.querySelector('input[name="cake-size"]:checked');
                const selectedFlavor = document.querySelector('input[name="cake-flavor"]:checked');
                const selectedStyle = document.querySelector('input[name="cake-style"]:checked');

                if (selectedSize) total += Number(selectedSize.dataset.price || 0);
                if (selectedFlavor) total += Number(selectedFlavor.dataset.price || 0);
                if (selectedStyle) total += Number(selectedStyle.dataset.price || 0);

                totalPriceText.textContent = `NT$ ${total}`;
            }

            // 2. 更新 SVG 文字
            function updateCakeText() {
                const selectedTextMode = document.querySelector('input[name="cake-text"]:checked')?.value;
                cakeSVGText.textContent = (selectedTextMode === "指定文字") ? cakeMessageArea.value : "";
            }

            // 3. 更新 SVG 風格圖案
            function updateCakeStyle() {
                const selectedStyle = document.querySelector('input[name="cake-style"]:checked')?.value;
                if (!stylePattern) return;

                const imagePath = styleImages[selectedStyle];
                if (imagePath) {
                    stylePattern.setAttribute('href', imagePath);
                    stylePattern.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', imagePath);
                    stylePattern.setAttribute("visibility", "visible");
                } else {
                    stylePattern.setAttribute("visibility", "hidden");
                }
            }

            // 事件監聽綁定
            flavorRadios.forEach(radio => {
                radio.addEventListener("change", function () {
                    const color = this.dataset.color;
                    if (color) {
                        if (cakeBase) cakeBase.setAttribute("fill", color);
                        if (cakeTopEllipse) cakeTopEllipse.setAttribute("fill", color);
                    }
                    updatePrice();
                });
            });

            colorRadios.forEach(radio => {
                radio.addEventListener("change", function () {
                    const color = this.dataset.color;
                    if (color && cakeLayer) {
                        cakeLayer.setAttribute("fill", color);
                    }
                });
            });

            if (cakeMessageArea) {
                cakeMessageArea.addEventListener("input", updateCakeText);
            }

            cakeTextRadios.forEach(radio => {
                radio.addEventListener("change", function () {
                    const isNoText = (this.value === "不要文字");
                    cakeMessageArea.value = isNoText ? "" : cakeMessageArea.value;
                    cakeMessageArea.disabled = isNoText;
                    updateCakeText();
                });
            });

            sizeRadios.forEach(radio => radio.addEventListener("change", updatePrice));

            styleRadios.forEach(radio => {
                radio.addEventListener("change", function () {
                    updatePrice();
                    updateCakeStyle();
                });
            });

            // 初始執行一次
            updatePrice();
            updateCakeText();
            updateCakeStyle();
        });
    </script>
</body>

</html>
